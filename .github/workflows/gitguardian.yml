name: GitGuardian Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install GitGuardian CLI
        run: python3 -m pip install ggshield --break-system-packages

      # 1️⃣ Detection step (controls security gate)
      - name: Run GitGuardian scan
        id: gg_scan
        continue-on-error: true
        run: ggshield secret scan repo .
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      # 2️⃣ JSON report (never fail)
      - name: Generate JSON report
        if: always()
        run: ggshield secret scan repo . --json --exit-zero > ggshield-report.json
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      # 3️⃣ Upload report
      - name: Upload GitGuardian report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitguardian-report
          path: ggshield-report.json

      # 4️⃣ Enforce failure at the END
      - name: Fail pipeline if secrets found
        if: steps.gg_scan.outcome == 'failure'
        run: exit 1
