name: GitGuardian Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install ggshield CLI correctly
      - name: Install GitGuardian CLI
        run: python3 -m pip install ggshield --break-system-packages

      # Run GitGuardian scan (fails job if secrets found)
      - name: Run GitGuardian scan
        run: ggshield secret scan repo .
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      # Generate JSON report
      - name: Generate JSON report
        run: ggshield secret scan repo . --json > ggshield-report.json
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      # Upload JSON report as artifact
      - name: Upload GitGuardian report
        uses: actions/upload-artifact@v4
        with:
          name: gitguardian-report
          path: ggshield-report.json
